<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA «Заметка»</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <link rel="icon" href="icon.png">
</head>
<body>
  <main>
    <h1>Моя заметка v2</h1>
        <button id="installBtn" hidden style="margin: 10px 0; padding: 10px 20px; background: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">Установить приложение</button>
    <textarea id="note" rows="8" cols="40"
      placeholder="Введите текст — он сохранится локально"></textarea>
       <h2>WebAssembly</h2>
    <button id="wasmBtn">Вычислить квадрат (Wasm)</button>
    <p>Результат: <span id="result">—</span></p>
  </main>
  <script>
    const area = document.getElementById('note');
    area.value = localStorage.getItem('note') || '';
    area.addEventListener('input', () =>
      localStorage.setItem('note', area.value));

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.error('Ошибка регистрации SW:', err));
    }
        // 3. Загрузка и вызов WebAssembly-модуля
    let wasmExports = null;
    fetch('./function.wasm')
      .then(r => r.arrayBuffer())
      .then(bytes => WebAssembly.instantiate(bytes))
      .then(obj => { wasmExports = obj.instance.exports; })
      .catch(err => console.error('Ошибка загрузки Wasm:', err));

    document.getElementById('wasmBtn').addEventListener('click', () => {
      if (wasmExports) {
        document.getElementById('result').textContent = wasmExports.square(7);
      } else {
        document.getElementById('result').textContent = 'Модуль ещё не загружен';
      }
    });
        // 4. Кнопка установки приложения (Вариант 1)
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Отменяем стандартный баннер браузера
      deferredPrompt = e; // Сохраняем событие
      installBtn.hidden = false; // Показываем нашу кнопку
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt(); // Показываем системный диалог установки
        const choice = await deferredPrompt.userChoice;
        console.log('Выбор пользователя:', choice.outcome); // 'accepted' или 'dismissed'
        deferredPrompt = null;
        installBtn.hidden = true; // Скрываем кнопку после установки
      }
    });
  </script>
</body>
</html>
