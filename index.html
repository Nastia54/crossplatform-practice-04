<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA «Заметка»</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d47a1">
  <link rel="icon" href="icon.png">
</head>
<body>
  <main>
    <h1>Моя заметка v2</h1>
    <textarea id="note" rows="8" cols="40"
      placeholder="Введите текст — он сохранится локально"></textarea>
       <h2>WebAssembly</h2>
    <button id="wasmBtn">Вычислить квадрат (Wasm)</button>
    <p>Результат: <span id="result">—</span></p>
  </main>
  <script>
    const area = document.getElementById('note');
    area.value = localStorage.getItem('note') || '';
    area.addEventListener('input', () =>
      localStorage.setItem('note', area.value));

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.error('Ошибка регистрации SW:', err));
    }
        // 3. Загрузка и вызов WebAssembly-модуля
    let wasmExports = null;
    fetch('./function.wasm')
      .then(r => r.arrayBuffer())
      .then(bytes => WebAssembly.instantiate(bytes))
      .then(obj => { wasmExports = obj.instance.exports; })
      .catch(err => console.error('Ошибка загрузки Wasm:', err));

    document.getElementById('wasmBtn').addEventListener('click', () => {
      if (wasmExports) {
        document.getElementById('result').textContent = wasmExports.square(7);
      } else {
        document.getElementById('result').textContent = 'Модуль ещё не загружен';
      }
    });
  </script>
</body>
</html>
